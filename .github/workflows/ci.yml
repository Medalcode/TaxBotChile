name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv pip install -r backend/requirements.txt -r dashboard/requirements.txt "bcrypt>=4.0.0,<4.1.0" pytest pytest-cov ruff mypy

      - name: Run Ruff Linter
        run: |
          uv run ruff check .

      - name: Run Mypy Type Checker
        run: |
          PYTHONPATH=backend uv run mypy backend/app dashboard

      - name: Run Pytest Suite with Coverage
        run: |
          uv run pytest --cov=backend/app --cov-report=term-missing tests/ -v
